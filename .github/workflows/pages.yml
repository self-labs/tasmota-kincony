name: Publish the flasher

on:
  push:
    branches: [master]
  workflow_dispatch:
  # Once a day, to pick up a firmware release made since the last deploy.
  schedule:
    - cron: "17 6 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ESP Web Tools fetches the firmware with fetch(), and GitHub release
      # downloads send no CORS headers, so the binaries have to be served from
      # the same Pages site as the page.
      - name: Fetch the latest firmware release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh release view --repo cateim/Tasmota --json tagName --jq .tagName)
          mkdir -p site/firmware
          gh release download "$tag" --repo cateim/Tasmota \
            --pattern 'tasmota32s3-ag8.factory.bin' \
            --pattern 'tasmota32s3-a16v3.factory.bin' \
            --dir site/firmware
          echo "FIRMWARE_TAG=$tag" >> "$GITHUB_ENV"

      # "version" is the release tag, on purpose. ESP Web Tools offers Update
      # only when the version a recognised board reports over Improv differs
      # from this field, and a board reports the bare Tasmota version, the same
      # for every house build of that Tasmota. With the Tasmota version here a
      # house-build fix would never be offered, and a board on a broken build
      # would read as up to date. The tag never matches, so a recognised board
      # is always offered Update, written without erasing.
      # "tasmota" is what the footer shows: TASMOTA_VERSION at the tag, written
      # the way Tasmota writes it, dropping a fourth number that is zero
      # (tasmota.ino:679-681), so 0x0F060001 is 15.6.0.1 and 0x0F070000 15.7.0.
      - name: Stamp the release and the Tasmota version into the manifests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          hex=$(gh api "repos/cateim/Tasmota/contents/tasmota/include/tasmota_version.h?ref=$FIRMWARE_TAG" \
            --jq .content | base64 -d | grep -oE 'TASMOTA_VERSION = 0x[0-9A-Fa-f]{8}' | grep -oE '0x[0-9A-Fa-f]{8}')
          test -n "$hex" || { echo "TASMOTA_VERSION not found at $FIRMWARE_TAG"; exit 1; }
          v=$((hex))
          version="$(( (v >> 24) & 255 )).$(( (v >> 16) & 255 )).$(( (v >> 8) & 255 ))"
          if [ $(( v & 255 )) -ne 0 ]; then version="$version.$(( v & 255 ))"; fi
          echo "Tasmota $version, build $FIRMWARE_TAG"
          for manifest in site/manifests/*.json; do
            jq --arg t "$FIRMWARE_TAG" --arg v "$version" '.version = $t | .tasmota = $v' \
              "$manifest" > "$manifest.tmp"
            mv "$manifest.tmp" "$manifest"
          done

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
